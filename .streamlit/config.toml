# Basis-Tokens für native Streamlit-Widgets. Typografie & Layout: utils/ui.py
[theme]
base = "light"
primaryColor = "#0071E3"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"
textColor = "#1D1D1F"
borderColor = "#D2D2D7"
linkColor = "#0071E3"
linkUnderline = false
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "full"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"

[client]
toolbarMode = "minimal"
